<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strikeglass</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="src/ui/sg-design-system.css">
<link rel="stylesheet" href="src/ui/friendly-design-system.css">
<link rel="stylesheet" href="src/ui/upload-flow.css">
</head>
<body>
<header>
<div>
<h1>Strikeglass</h1>
<p class="mut">Upload a Neverwinter combat log. Start with the party overview, then click a player or tab to load only the details you need.</p>
</div>
<input id="file" type="file" accept=".log,.txt,.csv">
</header>
<main>
<section class="toolbar">
<span id="status">No log loaded.</span>
<label>Player <select id="player"></select></label>
<label>Fight view <select id="mode"><option value="player">Selected player</option><option value="party">Whole party</option></select></label>
</section>
<nav id="chips" class="chips"></nav>
<section id="party"></section>
<nav id="tabs" class="tabs">
<button data-tab="overview" class="active">Player summary</button>
<button data-tab="timeline">Skill timing</button>
<button data-tab="damage">Skill damage</button>
<button data-tab="healing">Healing</button>
<button data-tab="taken">Damage received</button>
<button data-tab="shield">Shielding</button>
<button data-tab="timing">Use timing</button>
<button data-tab="pos">Combat advantage</button>
<button data-tab="deaths">Deaths</button>
<button data-tab="other">Extra checks</button>
<button data-tab="formulas">How numbers are counted</button>
</nav>
<div id="content" class="panel"><h2>Upload a combat log</h2><p class="mut">The app will show the party overview first. More detailed tables load only after you click them.</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="src/core/sg-core.js"></script>
<script src="src/core/sg-help-primitives.js"></script>
<script src="src/engine/combat-engine.js"></script>
<script src="src/engine/summary-engine.js"></script>
<script src="app.js"></script>
<script src="src/features/chart-controller.js"></script>
<script src="assets.js"></script>
<script src="asset-coverage-layer.js"></script>
<script src="class-power-map.js"></script>
<script src="src/features/category-clarity-layer.js"></script>
<script src="src/data/artifact-catalog.js"></script>
<script src="src/engine/artifact-window-engine.js"></script>
<script src="recovery.js"></script>
<script src="src/features/worker-parse-controller.js"></script>
<script src="power-icon-fix.js"></script>
<script src="feature-layer.js"></script>
<script src="ui-redesign.js"></script>
<script src="legend-layer.js"></script>
<script src="guided-ux-layer.js"></script>
<script src="class-detection-layer.js"></script>
<script src="asset-codex-layer.js"></script>
<script src="src/features/icon-mapper-rename.js"></script>
<script src="src/features/apex-visual-suite.js"></script>
<script src="src/features/final-chart-renderer.js"></script>
<script src="src/features/artifact-window-layer.js"></script>
<script src="src/features/help-controller.js"></script>
<script src="src/features/plain-language-layer.js"></script>
<script src="src/features/upload-flow.js"></script>
</body>
</html>
