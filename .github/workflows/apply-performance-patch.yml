name: Apply responsive performance patch

on:
  push:
    branches:
      - agent/responsive-loading-performance
    paths:
      - tools/performance-patch.part0
      - tools/performance-patch.part1
      - tools/performance-patch.part2
      - tools/performance-patch.part3
      - .github/workflows/apply-performance-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Improve loading responsiveness') }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/responsive-loading-performance
          fetch-depth: 0

      - name: Apply source patch
        run: |
          cat tools/performance-patch.part0 tools/performance-patch.part1 tools/performance-patch.part2 tools/performance-patch.part3 | base64 -d | gzip -d > /tmp/performance-patch.mjs
          node --check /tmp/performance-patch.mjs
          node /tmp/performance-patch.mjs
          rm -f tools/performance-patch.mjs.gz.b64
          rm tools/performance-patch.part0 tools/performance-patch.part1 tools/performance-patch.part2 tools/performance-patch.part3
          rm .github/workflows/apply-performance-patch.yml

      - name: Commit patched source
        run: |
          git config user.name "Nischhal Raj Subba"
          git config user.email "hinischalsubba@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve loading responsiveness"
          git push origin HEAD:agent/responsive-loading-performance
