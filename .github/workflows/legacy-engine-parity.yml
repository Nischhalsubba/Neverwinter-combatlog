name: Validate experimental engine parity

on:
  push:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'

permissions:
  contents: read

concurrency:
  group: legacy-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check browser-safe desktop runtime
        run: pnpm --filter @nevercombat/desktop test

  windows-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Run Windows engine executable tests
        run: dotnet run --project app/apps/windows/NexusCombatAnalyzer.Tests/NexusCombatAnalyzer.Tests.csproj
