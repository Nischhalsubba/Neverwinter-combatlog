name: Validate experimental engine parity

on:
  push:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'

permissions:
  contents: read

concurrency:
  group: legacy-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check browser-safe desktop runtime
        run: pnpm --filter @nevercombat/desktop test

  windows-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Windows engine executable tests
        run: dotnet run --project app/apps/windows/NexusCombatAnalyzer.Tests/NexusCombatAnalyzer.Tests.csproj
