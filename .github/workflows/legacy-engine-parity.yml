name: Validate experimental engine parity

on:
  push:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'

permissions:
  contents: read

concurrency:
  group: legacy-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check browser-safe desktop runtime
        run: pnpm --filter @nevercombat/desktop test

  windows-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Run Windows engine executable tests
        run: dotnet run --project app/apps/windows/NexusCombatAnalyzer.Tests/NexusCombatAnalyzer.Tests.csproj
