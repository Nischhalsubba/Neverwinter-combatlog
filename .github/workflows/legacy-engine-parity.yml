name: Validate experimental engine parity

on:
  push:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/apps/desktop/**'
      - 'app/apps/windows/**'
      - 'app/scripts/legacy-engine-parity-regression.mjs'
      - 'app/docs/ENGINE_PARITY.md'
      - 'app/tests/fixtures/**'
      - '.github/workflows/legacy-engine-parity.yml'

permissions:
  contents: read

concurrency:
  group: combatlog-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          install: false
          package-json-file: package.json
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check browser-safe desktop runtime
        run: pnpm --filter @nevercombat/desktop test

  windows-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Run Windows engine executable tests
        run: dotnet run --project app/apps/windows/NexusCombatAnalyzer.Tests/NexusCombatAnalyzer.Tests.csproj
