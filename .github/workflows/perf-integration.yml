name: Integrate high-refresh runtime

on:
  push:
    branches:
      - perf/120hz-runtime

concurrency:
  group: strikeglass-perf-120hz
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/120hz-runtime
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply runtime refactor
        working-directory: app
        run: |
          node scripts/apply-performance-refactor.mjs
          node scripts/finalize-performance-refactor.mjs
          node scripts/migrate-performance-regressions.mjs

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        working-directory: app
        run: pnpm check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore app/public 2>/dev/null || true
          git clean -fd app/public 2>/dev/null || true
          rm -f .github/workflows/perf-integration.yml app/scripts/apply-performance-refactor.mjs app/scripts/finalize-performance-refactor.mjs app/scripts/migrate-performance-regressions.mjs
          git add app .github/workflows/perf-integration.yml
          git diff --cached --check
          git commit -m "Optimize runtime for high refresh rates"
          git push origin HEAD:perf/120hz-runtime
