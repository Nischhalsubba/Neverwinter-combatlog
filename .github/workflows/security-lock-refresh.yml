name: Refresh security lockfile

on:
  push:
    branches:
      - chore/2026-security-baseline
    paths:
      - app/apps/desktop/package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.22.0
          install: false
          package-json-file: package.json
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- app/pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pnpm-lock.yaml
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin HEAD:chore/2026-security-baseline
