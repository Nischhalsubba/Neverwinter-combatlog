name: Refresh security lockfile

on:
  push:
    branches:
      - chore/2026-security-baseline
    paths:
      - app/apps/desktop/package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.22.0
          run_install: false
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-lockfile
          path: app/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
