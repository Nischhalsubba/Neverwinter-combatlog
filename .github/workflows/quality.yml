name: Validate Neverwinter combat log analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run parser tests and build
        run: pnpm check
      - name: Stage production manifest for local browser server
        run: cp public/site.webmanifest site.webmanifest
      - name: Run browser reliability matrix
        run: pnpm test:browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strikeglass-browser-diagnostics
          path: app/test-artifacts/browser
          if-no-files-found: ignore
          retention-days: 7
