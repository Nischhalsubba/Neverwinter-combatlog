name: Validate Neverwinter combat log analyzer

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'
      - '.github/workflows/quality.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'
      - '.github/workflows/quality.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STRIKEGLASS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and build exact production artifact
        run: |
          mkdir -p test-artifacts/ci
          set -o pipefail
          pnpm check 2>&1 | tee test-artifacts/ci/check.log
      - name: Stage source manifest for legacy browser reliability server
        run: cp public/site.webmanifest site.webmanifest
      - name: Test source and exact production artifact in Chromium
        run: pnpm test:browser
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: strikeglass-ci-diagnostics
          path: |
            app/test-artifacts/browser
            app/test-artifacts/ci
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve tested production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: strikeglass-production-${{ env.STRIKEGLASS_SOURCE_SHA }}
          path: app/public
          if-no-files-found: error
          retention-days: 14
