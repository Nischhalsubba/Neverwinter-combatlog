name: Validate Neverwinter combat log analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: combatlog-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          install: false
          package-json-file: package.json
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.22.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: pnpm audit --audit-level low
      - name: Run parser tests and build
        run: pnpm check
      - name: Stage production manifest for local browser server
        run: cp public/site.webmanifest site.webmanifest
      - name: Run browser reliability matrix
        run: pnpm test:browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strikeglass-browser-diagnostics
          path: app/test-artifacts/browser
          if-no-files-found: ignore
          retention-days: 7
