name: Validate Neverwinter combat log analyzer

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'
      - '.github/workflows/quality.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'
      - '.github/workflows/quality.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: combatlog-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STRIKEGLASS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          install: false
          package-json-file: package.json
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.22.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level low
      - name: Run tests and build exact production artifact
        run: |
          mkdir -p test-artifacts/ci
          set -o pipefail
          pnpm check 2>&1 | tee test-artifacts/ci/check.log
      - name: Stage source manifest for legacy browser reliability server
        run: cp public/site.webmanifest site.webmanifest
      - name: Test source and exact production artifact in Chromium
        run: pnpm test:browser
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strikeglass-ci-diagnostics
          path: |
            app/test-artifacts/browser
            app/test-artifacts/ci
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve tested production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strikeglass-production-${{ env.STRIKEGLASS_SOURCE_SHA }}
          path: app/public
          if-no-files-found: error
          retention-days: 14
