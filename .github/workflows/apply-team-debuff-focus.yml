name: Apply focused team debuff integration

on:
  push:
    branches: [fix/team-debuff-focus]
    paths:
      - .github/workflows/apply-team-debuff-focus.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/team-debuff-focus
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Apply focused debuff patch
        working-directory: app
        run: node scripts/apply-team-debuff-focus.mjs
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run complete validation
        working-directory: app
        run: pnpm check
      - name: Check patch cleanliness
        run: git diff --check
      - name: Commit validated integration
        run: |
          git config user.name "Nischhal Raj Subba"
          git config user.email "hinischalsubba@gmail.com"
          git add app/src/data/support-effect-catalog.js app/src/engine/boss-effects.js app/src/engine/combat-effects.js app/src/v7/boss-effects.js app/src/v10/power-timing-interactions.js app/src/v10/power-timing-interactions.css app/scripts/boss-effects-regression.mjs app/scripts/support-effect-catalog-regression.mjs app/scripts/power-timing-interaction-regression.mjs
          git rm app/scripts/apply-team-debuff-focus.mjs .github/workflows/apply-team-debuff-focus.yml
          git commit -m "Focus debuffs on team damage support"
          git push origin HEAD:fix/team-debuff-focus
