name: Tune team debuff timeline

on:
  push:
    branches: [fix/team-debuff-focus]
    paths:
      - .github/workflows/tune-team-debuff-timeline.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/team-debuff-focus
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Apply safe timeline tuning
        working-directory: app
        run: node scripts/tune-team-debuff-timeline.mjs
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run complete validation
        working-directory: app
        run: pnpm check
      - name: Check patch cleanliness
        run: git diff --check
      - name: Commit validated tuning
        run: |
          git config user.name "Nischhal Raj Subba"
          git config user.email "hinischalsubba@gmail.com"
          git add app/src/v10/power-timing-interactions.js app/scripts/power-timing-interaction-regression.mjs
          git rm app/scripts/tune-team-debuff-timeline.mjs .github/workflows/tune-team-debuff-timeline.yml
          git commit -m "Keep deep timeline zoom within canvas limits"
          git push origin HEAD:fix/team-debuff-focus
