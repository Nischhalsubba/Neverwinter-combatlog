name: Integrate accessibility settings

on:
  push:
    branches:
      - fix/accessibility-settings

concurrency:
  group: strikeglass-accessibility-settings
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out settings branch
        uses: actions/checkout@v4
        with:
          ref: fix/accessibility-settings
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply accessibility settings integration
        working-directory: app
        run: node scripts/apply-accessibility-settings.mjs

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        working-directory: app
        run: pnpm check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore app/public 2>/dev/null || true
          git clean -fd app/public 2>/dev/null || true
          rm -f .github/workflows/accessibility-settings-integration.yml app/scripts/apply-accessibility-settings.mjs
          git add app .github/workflows/accessibility-settings-integration.yml
          git diff --cached --check
          git commit -m "Improve contrast and add app settings"
          git push origin HEAD:fix/accessibility-settings
