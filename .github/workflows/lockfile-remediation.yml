name: Temporary lockfile remediation

on:
  push:
    branches:
      - chore/2026-security-baseline
    paths:
      - 'app/package.json'
      - 'app/apps/desktop/package.json'
      - 'app/pnpm-workspace.yaml'
      - '.github/workflows/lockfile-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combatlog-lockfile-remediation
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/2026-security-baseline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.22.0
          install: false
          package-json-file: package.json
      - name: Refresh lockfile from patched constraints
        run: pnpm --dir app install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify zero known dependency vulnerabilities
        run: pnpm --dir app audit --audit-level low
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- app/pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pnpm-lock.yaml
          git commit -m 'chore: refresh security lockfile'
          git push origin HEAD:chore/2026-security-baseline
