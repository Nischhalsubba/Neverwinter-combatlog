name: Apply verified debuff icons

on:
  push:
    branches:
      - feat/verified-effect-catalog
    paths:
      - app/scripts/patch-debuff-icons.mjs
      - .github/workflows/apply-debuff-icons.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/verified-effect-catalog
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Apply debuff icon patch
        run: node app/scripts/patch-debuff-icons.mjs
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run complete validation
        working-directory: app
        run: pnpm check
      - name: Commit validated icon integration
        run: |
          git restore --worktree --staged app/public || true
          rm -f app/scripts/patch-debuff-icons.mjs .github/workflows/apply-debuff-icons.yml
          git config user.name "Nischhal Raj Subba"
          git config user.email "hinischalsubba@gmail.com"
          git add -A app/src/v7/boss-effects.js app/src/v7/boss-effects.css app/scripts/patch-debuff-icons.mjs .github/workflows/apply-debuff-icons.yml
          git diff --cached --check
          git commit -m "feat(debuffs): reuse validated class power icons"
          git push origin HEAD:feat/verified-effect-catalog
