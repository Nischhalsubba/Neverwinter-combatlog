name: Apply Power Timing engine patch

on:
  push:
    branches:
      - feat/power-timing-interactions
    paths:
      - app/scripts/patch-power-timing-engine.mjs
      - .github/workflows/apply-power-timing-engine.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/power-timing-interactions
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Apply verified engine patch
        run: node app/scripts/patch-power-timing-engine.mjs
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run complete validation
        working-directory: app
        run: pnpm check
      - name: Commit validated engine integration
        run: |
          git restore --worktree --staged app/public || true
          git config user.name "Nischhal Raj Subba"
          git config user.email "hinischalsubba@gmail.com"
          git add app/src/workers/fast-parse-worker.js app/src/engine/verification-engine.js app/scripts/patch-power-timing-engine.mjs .github/workflows/apply-power-timing-engine.yml
          git diff --cached --check
          git commit -m "feat(power-timing): verify hit details and interactions"
          git push origin HEAD:feat/power-timing-interactions
