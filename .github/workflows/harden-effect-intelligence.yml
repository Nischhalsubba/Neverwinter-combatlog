name: Harden effect intelligence

on:
  push:
    branches: [feat/effect-intelligence-layout]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize effect intelligence hardening') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/effect-intelligence-layout
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Apply scale hardening
        working-directory: app
        run: node scripts/harden-effect-intelligence.mjs
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run full validation
        working-directory: app
        run: pnpm check
      - name: Check patch hygiene
        run: git diff --check -- app/src/engine/effect-intelligence-engine.js
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/engine/effect-intelligence-engine.js
          git rm app/scripts/harden-effect-intelligence.mjs .github/workflows/harden-effect-intelligence.yml
          git commit -m "Finalize effect intelligence hardening"
          git push origin HEAD:feat/effect-intelligence-layout
