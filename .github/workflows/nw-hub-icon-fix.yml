name: NW Hub icon validation

on:
  push:
    branches:
      - chore/nw-hub-icon-fix
    paths:
      - .github/workflows/nw-hub-icon-fix.yml
      - app/scripts/nw-hub-icon-fix.mjs

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser client
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Export and validate class power icons
        env:
          OUTPUT_DIR: ${{ github.workspace }}/nw-hub-power-icons-fixed
        run: node app/scripts/nw-hub-icon-fix.mjs

      - name: Upload validated icon artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw-hub-power-icons-fixed
          path: nw-hub-power-icons-fixed
          if-no-files-found: error
          retention-days: 3
