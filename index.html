<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astral Combat Web Parser</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<div>
<h1>Astral Combat Web Parser</h1>
<p class="mut">Upload a Neverwinter combat log. Parsing runs locally in your browser.</p>
</div>
<input id="file" type="file" accept=".log,.txt,.csv">
</header>
<main>
<section class="toolbar">
<span id="status">No log loaded.</span>
<label>Player <select id="player"></select></label>
<label>Encounter split <select id="mode"><option value="player">Selected player</option><option value="party">Party</option></select></label>
</section>
<nav id="chips" class="chips"></nav>
<section id="party"></section>
<nav id="tabs" class="tabs">
<button data-tab="overview" class="active">Overview</button>
<button data-tab="timeline">Timeline & Powers</button>
<button data-tab="damage">Damage Out</button>
<button data-tab="healing">Healing</button>
<button data-tab="taken">Damage Taken</button>
<button data-tab="shield">Shielding</button>
<button data-tab="timing">Timing</button>
<button data-tab="pos">Positioning</button>
<button data-tab="deaths">Deaths</button>
<button data-tab="other">Other</button>
<button data-tab="formulas">Combat Formulas</button>
</nav>
<div id="content" class="panel"><h2>Upload a combat log</h2></div>
</main>
<script src="parser.js"></script>
<script src="app.js"></script>
<script src="recovery.js"></script>
</body>
</html>
